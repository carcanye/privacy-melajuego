<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeLaJuego</title>
  <meta name="description" content="MeLaJuego — el juego de preguntas y respuestas. Información legal." />
  <style>
    :root {
      --amarillo: #FFE135;
      --negro: #1a1a1a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--amarillo);
      color: var(--negro);
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 4px solid var(--negro);
      border-radius: 22px;
      box-shadow: 10px 10px 0 var(--negro);
      padding: 40px 32px;
      text-align: center;
    }
    h1 {
      font-size: 2.6rem;
      margin: 0 0 8px;
      letter-spacing: -1px;
    }
    p.sub { margin: 0 0 32px; opacity: 0.75; }
    a.btn {
      display: block;
      margin: 12px 0;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--negro);
      background: var(--amarillo);
      border: 3px solid var(--negro);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--negro);
      transition: transform .08s ease, box-shadow .08s ease;
    }
    a.btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 var(--negro);
    }
    .mail { margin-top: 28px; font-size: 0.9rem; opacity: 0.75; }
    .mail a { color: #0b5ed7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MeLaJuego</h1>
    <p class="sub">El juego de preguntas y respuestas</p>
    <a class="btn" href="privacidad.html">Política de Privacidad</a>
    <a class="btn" href="terminos.html">Términos de Uso</a>
    <p class="mail">Contacto: <a href="mailto:gestibro@gmail.com">gestibro@gmail.com</a></p>
  </div>
</body>
</html>
